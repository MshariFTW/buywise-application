services:
  - type: web
    name: buywise-rugs
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python buywise_plus.py
    healthCheckPath: /healthz
    envVars:
      - fromGroup: SERPAPI_KEY
      - key: DATABASE_URL
        sync: false
      - key: BUYWISE_SERP_DAILY
        value: "15"
      - key: BUYWISE_SERP_MONTHLY
        value: "225"
      - key: BUYWISE_SERP_PER_VISITOR
        value: "5"
